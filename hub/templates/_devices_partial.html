{% if devices %}
  <div class="device-grid">
    {% for device in devices %}
      <article class="device-card">
        <div class="device-card-head">
          <h3>{{ device.node_id }}</h3>
          <span class="status-pill {{ device.status_class }}">{{ device.status }}</span>
        </div>
        <dl class="device-meta">
          <div>
            <dt>Last seen</dt>
            <dd>{{ device.last_seen }}</dd>
          </div>
          <div>
            <dt>Capabilities</dt>
            <dd>{{ device.capabilities }}</dd>
          </div>
        </dl>
      </article>
    {% endfor %}
  </div>
{% else %}
  <p class="empty-state">No devices have registered yet.</p>
{% endif %}
